# ============================================================================
#  Compila el APK de Android en la nube (GitHub Actions)
# ----------------------------------------------------------------------------
#  No necesitas Android Studio ni el SDK en tu PC: GitHub lo hace por ti y
#  deja el APK como "artifact" para que lo descargues.
#
#  Se ejecuta:
#   - solo, cada vez que cambias la página en la rama main
#   - a mano, desde la pestaña "Actions" del repositorio (botón Run workflow)
# ============================================================================

name: Compilar APK de Android

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "admin.js"
      - "datos.js"
      - "estilos.css"
      - "manifest.json"
      - "sw.js"
      - "iconos/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  compilar-apk:
    name: Generar el APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar la carpeta web (lo que verá la app)
        run: |
          mkdir -p www/iconos
          cp index.html datos.js app.js admin.js estilos.css manifest.json sw.js www/
          cp iconos/*.png www/iconos/
          echo "Archivos que se empaquetan:"; ls -la www www/iconos

      - name: Instalar Capacitor (convierte la web en app Android)
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Configurar la app
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "cu.copa.futbol",
            "appName": "Copa de Futbol",
            "webDir": "www",
            "android": { "allowMixedContent": false }
          }
          JSON
          cat capacitor.config.json

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar el APK para descargar
        run: |
          mkdir -p entrega
          cp android/app/build/outputs/apk/debug/app-debug.apk entrega/Copa-Futbol.apk
          ls -lh entrega/

      - name: Guardar el APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Copa-Futbol-APK
          path: entrega/Copa-Futbol.apk
          if-no-files-found: error
          retention-days: 90
